<html>
  <head>
    <title>練習(四)：文字樣式設定</title>
  </head>
  <style>
    body {
      padding: 5px;
      background: lightblue;
      display: flex;
      flex-direction: column;
    }

    span {
      width: 100%;
    }

    span.left {
      text-align: left;
      color: yellow;
    }

    span.middle {
      color: green;
      text-align: center;
    }

    span.right {
      text-align: right;
      color: blue;
    }

    h2.box {
      background: tomato;
    }

    .courier-new {
      font-family: "Courier New", monospace;
    }

    span.box {
      background: orange;
      text-align: center;
    }
  </style>
  <body>
    <span class="right">hope</span>
    <span class="middle">courtesy</span>
    <span class="left">faith</span>
    <h2 class="box">LOVE</h2>
    <span class="courier-new">Courrier New</span>
    <span class="box">CL</span>
  </body>
</html>
