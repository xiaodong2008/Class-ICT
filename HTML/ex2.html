<html>
  <head>
    <title>練習(二)：基本編碼</title>
  </head>
  <body>
    <h1>Largest heading</h1>
    <span>This is <b>bold</b>.</span>
    <!-- italic -->
    <span>This is <i>italic</i>.</span>
    <!-- divider -->
    <hr />
    <!-- smallest heading -->
    <h6>Smallest heading</h6>
    <!-- x^2 + 2x = 1 = 0 -->
    <span>x<sup>2</sup> + 2x = 1 = 0</span>
    <!-- (underline) Hv2O -->
    <p>
      水的化学式是<span style="text-decoration-line: underline"
        >H<sub>2</sub>O</span
      >
    </p>
  </body>
</html>
